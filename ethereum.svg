
<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="512"
     viewBox="0 0 512 512">

  <title>Ethereum Logo</title>

  <defs>
    <linearGradient id="ethGradient"
                    x1="0" y1="0"
                    x2="1" y2="1">
      <stop offset="0%" stop-color="#8A92B2"/>
      <stop offset="100%" stop-color="#454A75"/>
    </linearGradient>
  </defs>

  <!-- Ethereum upper diamond -->
  <path fill="url(#ethGradient)"
        d="M256 30
           L110 270
           L256 205
           L402 270
           Z"/>

  <!-- Ethereum lower diamond -->
  <path fill="#62688F"
        d="M256 235
           L110 295
           L256 482
           L402 295
           Z"/>

  <!-- Inner facets -->
  <path fill="#8A92B2"
        d="M256 235
           L110 295
           L256 365
           Z"/>

  <path fill="#454A75"
        d="M256 235
           L402 295
           L256 365
           Z"/>

</svg>
